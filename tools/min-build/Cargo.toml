[package]
name = "min-build"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "neu-kompilieren"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23.1"
console = "0.16"
dialoguer = "0.12"
hex-literal = "1"
indicatif = "0.18"
serde_json = "1.0.154"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
xz-native = "1.1.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
